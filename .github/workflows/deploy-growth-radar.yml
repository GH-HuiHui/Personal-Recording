name: 发布成长雷达到 GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - growth-radar-preview/**
      - .github/workflows/deploy-growth-radar.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: growth-radar-preview
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 设置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-radar-preview/package-lock.json
      - name: 安装锁定依赖
        run: npm ci --ignore-scripts
      - name: 运行测试
        run: npm test -- --run
      - name: 检查高风险依赖
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: 构建静态站点
        run: npm run build
      - name: 配置 Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: 上传静态产物
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: growth-radar-preview/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
